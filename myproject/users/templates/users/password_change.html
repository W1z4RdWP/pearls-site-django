{% extends "layout.html" %}
{% load crispy_forms_tags %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="content-section">
    <h2>Смена пароля</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary" type="submit">Сменить пароль</button>
    </form>
</div>
{% endblock %}
