{% extends 'layout.html' %}
{% block content %}
<h2>Добавить урок в курс "{{ course.title }}"</h2>
<form method="post">
    {% csrf_token %}
    <h4>Выберите существующий урок:</h4>
    <select name="lesson_id" class="form-select mb-3">
        {% for lesson in existing_lessons %}
            <option value="{{ lesson.id }}">{{ lesson.title }}</option>
        {% empty %}
            <option disabled>Нет доступных уроков</option>
        {% endfor %}
    </select>
    <button type="submit" name="select_existing" class="btn btn-primary">Сохранить</button>
    <hr>
    <button type="submit" name="create_new" class="btn btn-success">Создать новый урок</button>
</form>
{% endblock %}
