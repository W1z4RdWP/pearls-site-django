<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Конструктор обучения{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'builder/css/builder_style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Learning Path</h1>
            <nav class="main-nav">
                <!-- Навигационные ссылки -->
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Learning Path Builder</p>
        </div>
    </footer>
</body>
</html>
