{% extends 'layout.html' %}
{% block title %}Панель управления базы знаний{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-3" style="min-width: 250px;">
        <div class="list-group mb-4" style="box-shadow: 0 2px 8px #0001;">
            <a href="{% url 'builder:dashboard' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="fas fa-tachometer-alt"></i> Панель управления
            </a>
            <a href="{% url 'user_management:user_list' %}" class="list-group-item list-group-item-action">
                <i class="fas fa-users"></i> Пользователи
            </a>
            <a href="{% url 'builder:lesson_master' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'lesson_master' %}active{% endif %}">
                <i class="fas fa-book"></i> Содержание
            </a>
        </div>
    </div>
    <div class="col-md-9">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="mb-4">Панель управления</h2>
                <div style="height: 200px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 2rem; background: #f8f9fa; border-radius: 8px;">
                    Информационная панель
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
