{% extends 'layout.html' %}
{% load static %}
{% block title %}Новый инцидент{% endblock %}
{% block specific_styles %}
<link rel="stylesheet" href="{% static 'builder/css/builder_style.css' %}">
<style>
    .incident-form-bg { background: #383838; min-height: 100vh; padding: 40px 0; }
    .incident-form-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #0002; padding: 32px 32px 24px 32px; max-width: 700px; margin: 0 auto; }
    .incident-form-card h2 { color: #232323; font-weight: 700; margin-bottom: 32px; letter-spacing: 0.5px; }
    .incident-form-card form label { font-weight: 600; color: #232323; margin-bottom: 6px; }
    .incident-form-card form input, .incident-form-card form select, .incident-form-card form textarea {
        width: 100%;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        padding: 10px 12px;
        margin-bottom: 18px;
        font-size: 1.05em;
        background: #f8f9fa;
        transition: border 0.2s;
    }
    .incident-form-card form input:focus, .incident-form-card form select:focus, .incident-form-card form textarea:focus {
        border: 1.5px solid #4d7cff;
        outline: none;
        background: #fff;
    }
    .incident-form-card .btn {
        min-width: 120px;
        font-size: 1.05em;
        margin-right: 10px;
        margin-top: 8px;
    }
    @media (max-width: 768px) { .incident-form-card { padding: 18px 8px; max-width: 100%; } }
</style>
{% endblock %}
{% block content %}
<div class="incident-form-bg">
    <div class="incident-form-card">
        <h2 class="mb-4">Новый инцидент</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'builder:incidents' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
