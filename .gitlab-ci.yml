stages:
  - test
  - build
  - deploy

test:
  stage: test
  only:
    - main
  script:
    - pwd
    - echo "Test 1 passed"
    - sleep 2
    - ls
    - whoami
    - echo "Test 2 passed"
    - sleep 1
    - echo "Tests completed"
  tags:
    - prod-server-shell

build:
  stage: build
  only:
    - main
  script:
    - echo "Building..."
    - sleep 1
    - echo "Build completed"
  tags:
    - prod-server-shell


deploy:
  stage: deploy
  only:
    - main
  script:
    - echo "Deploying..."
    - sleep 5
    - echo "Deploy completed"
  tags:
    - prod-server-shell
