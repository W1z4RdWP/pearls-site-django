stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - echo "Running tests..."
    - echo "Test 1 passed"
    - sleep 2
    - echo "Test 2 passed"
    - sleep 1
    - echo "Tests completed"

build:
  stage: build
  script:
    - echo "Building..."
    - pip install -r requirements.txt
    - echo "Build completed"


deploy:
  stage: deploy
  script:
    - echo "Deploying..."
    - sleep 5
    - echo "Deploy completed"