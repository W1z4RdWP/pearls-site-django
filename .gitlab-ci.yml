stages:
  - test
  - merge

test:
  stage: test
  script:
    - echo "Запуск тестов..."
    - cd /home/django-user/pearls-site-django/myproject
    - source ../.venv/bin/activate
    - pip install -r requirements.txt || { echo "Ошибка при установке зависимостей"; exit 1; }
  only:
    - dev

merge:
  stage: merge
  script:
    - echo "Выполняем merge dev в main"
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@example.com"
    - git fetch origin
    - git checkout main
    - git merge origin/dev
    - git remote set-url origin https://gitlab-ci-token:${CI_PUSH_TOKEN}@gitlab.smileterritory.ru/root/pearls-site-django.git
    - git push origin main
  only:
    - dev
  when: on_success
  dependencies:
    - test








