stages:
  - deploy

deploy_production:
  stage: deploy
  only:
    - main
  before_script:
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H 10.0.1.125 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh django-user@10.0.1.125
    - bash /home/django-user/pearls-site-django/scripts/update.sh
