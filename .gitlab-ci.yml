stages:
  - test
  - build
  - deploy

test:
  stage: test
  only:
    - main
  script:
    - ip a
    - sleep 4
    - python -m venv .venv
    - source .venv/bin/activate && cd myproject
    - pip install -r requirements.txt
    - sleep 2
    - python manage.py test users --settings=myproject.settings.prod
    - echo "Test 2 passed"
    - sleep 1
    - echo "Tests completed"
  tags:
    - prod-server-shell

build:
  stage: build
  only:
    - main
  script:
    - echo "Building..."
    - sleep 1
    - echo "Build completed"
  tags:
    - prod-server-shell


deploy:
  stage: deploy
  only:
    - main
  script:
    - echo "Deploying..."
    - sleep 5
    - echo "Deploy completed"
  tags:
    - prod-server-shell
