stages:
  - test
  - build
  - deploy

test:
  stage: test
  only:
    - main
  services:
    - postgres:15
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  script:
    - whoami
    - python -m venv .venv
    - source .venv/bin/activate && cd myproject
    - pip install -r requirements.txt
    - mkdir -p /tmp/django_logs
    - export DJANGO_LOG_DIR=/tmp/django_logs
    - ls -la /var/log/django
    - sleep 2
    - python manage.py test users --settings=myproject.settings.test
    - echo "Test 2 passed"
    - sleep 1
    - echo "Tests completed"
  tags:
    - prod-server-shell

build:
  stage: build
  only:
    - main
  script:
    - echo "Building..."
    - sleep 1
    - echo "Build completed"
  tags:
    - prod-server-shell


deploy:
  stage: deploy
  only:
    - main
  script:
    - echo "Deploying..."
    - sleep 5
    - echo "Deploy completed"
  tags:
    - prod-server-shell
